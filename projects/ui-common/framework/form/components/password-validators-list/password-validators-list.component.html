<h5 class="password-validators-list--header">
  Password must meet the following
  <br />
  requirements:
</h5>
<hr />
<div class="password-validators-list--items">
  @for (item of _records$ | async; track item._id) {
    <div class="password-validators-list--item">
      <div class="password-validators-list--item-icon">
        @if (item.icon) {
          <seam-icon [icon]="item.icon" [class]="item.iconClass"></seam-icon>
        }
      </div>
      {{ item.message }}
    </div>
  }
</div>
