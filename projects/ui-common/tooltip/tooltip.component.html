<div class="tooltip-inner" [ngClass]="tooltipClass">
  <!-- String content -->
  <span *ngIf="isStringContent">{{ content }}</span>

  <!-- Template content -->
  <ng-container *ngIf="isTemplateContent">
    <ng-container *ngTemplateOutlet="templateContent; context: context"></ng-container>
  </ng-container>
</div>
<div class="arrow"></div>
