<h3 class="h6">Show/Hide Columns</h3>

<seam-form-field [numPaddingErrors]="0" class="position-relative">
  <input
    seamInput
    [formControl]="_filterControl"
    seamInputSize="sm"
    placeholder="Search"
    seamAutoFocus
  />
</seam-form-field>

<div class="columns-list flex-grow-1 overflow-auto">
  <ng-container *ngFor="let col of _columns$ | async">
    <seam-checkbox [checked]="!col.hidden" (change)="_onChange($event, col)">{{
      col.name || col.prop
    }}</seam-checkbox>
  </ng-container>
</div>
