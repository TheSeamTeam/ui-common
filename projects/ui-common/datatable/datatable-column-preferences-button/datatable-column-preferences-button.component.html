<ng-template #colPrefsTpl>
  <seam-datatable-column-preferences></seam-datatable-column-preferences>
</ng-template>

<seam-menu
  #menu
  menuClass="list-group py-0 border-0 seam-datatable-action-menu"
  animationType="fade"
>
  <button
    seamMenuItem
    type="button"
    class="list-group-item list-group-item-action py-1"
    [seamPopover]="colPrefsTpl"
  >
    Show/Hide Columns
  </button>

  <button
    seamMenuItem
    type="button"
    class="list-group-item list-group-item-action py-1"
    (click)="_resetColumns($event)"
  >
    Reset Columns
  </button>

  @if (_datatable.allowUserAutoHeaderHeight) {
    <button
      seamMenuItem
      type="button"
      class="list-group-item list-group-item-action py-1 d-flex align-items-center"
      role="menuitemcheckbox"
      [attr.aria-checked]="_datatable.userHeaderHeight === 'auto'"
      (click)="_toggleAutoHeaderHeight()"
    >
      Fit Header Text
      @if (_datatable.userHeaderHeight === 'auto') {
        <seam-icon class="ml-auto pl-2" [icon]="checkIcon"></seam-icon>
      }
    </button>
  }
</seam-menu>

<button
  type="button"
  class="btn btn-lightgray btn-sm"
  [seamMenuToggle]="menu"
  [positions]="_actionMenuPositions || []"
  style="padding-left: 10px; padding-right: 10px"
  title="Column Preferences"
>
  <seam-icon [icon]="icon"></seam-icon>
  <span class="sr-only">Column Preferences</span>
</button>
